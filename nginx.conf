server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # MIME types — without explicit include, nginx serves everything as
    # application/octet-stream, which makes browsers download instead of render.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Healthcheck for k8s liveness/readiness probes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Static assets — long cache; Cloudflare also caches these.
    location ~* \.(ico|webp|png|jpg|jpeg|gif|svg|css|js|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PDFs — force Content-Disposition: attachment so the browser downloads
    # rather than rendering in the built-in viewer. Cache 7 days; we update
    # the file when CV content changes.
    location ~* \.pdf$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    # Everything else falls to index.html so client-side routing (if any later)
    # still works. For this static page it just means / serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
