# Cache for /deploys (below). This file is included inside the image's http {}
# block, so the zone can be declared here. /var/cache/nginx is an emptyDir.
proxy_cache_path /var/cache/nginx/tg levels=1 keys_zone=tg:1m max_size=5m
                 inactive=10m use_temp_path=off;

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The public preview of the t.me/onemsplatform channel, for the "recent
    # deploys" block on the page. A browser cannot read t.me itself (no CORS,
    # and X-Frame-Options forbids an iframe), so this proxies it same-origin.
    #
    # One upstream request a minute per replica, whatever the traffic: the key
    # is constant, so a query string cannot bust the cache, and cache_lock keeps
    # concurrent misses to one fetch. That matters beyond this page: the
    # cluster's egress IP is shared with the agents' Telegram bot, and hammering
    # t.me from it could get that IP limited.
    #
    # The response is Telegram's HTML page. Opened directly, it would run
    # telegram.org's scripts under this origin; the sandbox CSP stops that. The
    # page's fetch() still reads it as text.
    #
    # The resolver makes nginx resolve t.me per request (cached 5 min), so a
    # DNS failure breaks only this block, never the start of the site. The IP
    # is the cluster DNS Service (kube-dns in kube-system).
    location = /deploys {
        resolver 10.96.5.5 valid=300s ipv6=off;
        resolver_timeout 3s;
        set $tg_preview "https://t.me/s/onemsplatform";
        proxy_pass $tg_preview;
        proxy_ssl_server_name on;
        proxy_set_header Host t.me;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_ignore_headers Set-Cookie Cache-Control Expires X-Accel-Expires;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;

        proxy_cache tg;
        proxy_cache_key "t.me/s/onemsplatform";
        proxy_cache_valid 200 60s;
        proxy_cache_valid any 15s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        add_header Cache-Control "public, max-age=60" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # HTML — short cache + must-revalidate so the browser always rechecks
    # before reusing. Edits to index.html are picked up on next refresh.
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # CSS / JS — short cache, no immutable. We rewrite these files in place
    # on every build, so we explicitly want the browser to re-check.
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # Images and fonts — longer cache. These rarely change content for
    # the same filename. If you need a hard refresh, bump the filename
    # or purge the CDN.
    location ~* \.(ico|webp|png|jpg|jpeg|gif|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # PDFs — force download, medium cache.
    location ~* \.pdf$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
