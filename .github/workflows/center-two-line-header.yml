name: center-two-line-header
on:
  push:
    branches: [fix/center-two-line-header]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/center-two-line-header
      - name: Patch only the top ribbon, not other author links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('public/index.html')
          text = p.read_bytes().decode('utf-8')
          pairs = [('about', 'me'), ('link', 'shortener'), ('Kubernetes platform', 'architecture'), ('Agentic AI', 'architecture'), ('AI SRE', 'agent'), ('secrets', 'toolkit'), ('IP', 'checker')]
          navs = list(re.finditer(r'(<nav\b[^>]*\bclass="ribbon-nav"[^>]*>)(.*?)(</nav>)', text, re.S))
          assert len(navs) == 1
          nav = navs[0]
          inner = nav.group(2)
          anchor_re = re.compile(r'(<a\b[^>]*>)(.*?)(</a>)', re.S)
          anchors = list(anchor_re.finditer(inner))
          assert [a.group(2) for a in anchors] == [' '.join(pair) for pair in pairs]
          # Author links elsewhere on the architecture page are not header brands.
          assert len(re.findall(r'<a\b[^>]*\bclass="brand"[^>]*>Aaron Shemtov</a>', text)) == 1
          replacement = inner
          for a, pair in reversed(list(zip(anchors, pairs))):
              replacement = replacement[:a.start(2)] + '<br>'.join(pair) + replacement[a.end(2):]
          after = list(anchor_re.finditer(replacement))
          assert [a.group(1) for a in after] == [a.group(1) for a in anchors]
          assert [a.group(2).split('<br>') for a in after] == [list(pair) for pair in pairs]
          strip_labels = lambda s: anchor_re.sub(lambda a: a.group(1) + a.group(3), s)
          assert strip_labels(inner) == strip_labels(replacement)
          updated = text[:nav.start(2)] + replacement + text[nav.end(2):]
          assert updated.replace(replacement, inner, 1) == text
          css_path = Path('public/blueprint.css')
          css = css_path.read_bytes()
          assert b'/* Center ribbon labels without moving the existing header blocks. */' not in css
          override = b'''\n/* Center ribbon labels without moving the existing header blocks. */
          .ribbon .ribbon-left {
            justify-content: center;
          }
          .ribbon .ribbon-left .brand {
            white-space: nowrap;
            text-align: center;
          }
          .ribbon .ribbon-nav > a {
            display: block;
            text-align: center;
            white-space: nowrap;
            line-height: 1.2;
          }
          '''
          p.write_bytes(updated.encode('utf-8'))
          css_path.write_bytes(css + (b'' if css.endswith(b'\n') else b'\n') + override)
          print('Validated: seven two-line labels, unchanged attributes and all other HTML, append-only scoped CSS')
          PY
          git diff --check
          test "$(git branch --show-current)" = fix/center-two-line-header
          rm .github/workflows/center-two-line-header.yml header-patch-diagnostic.txt
          git add public/index.html public/blueprint.css .github/workflows/center-two-line-header.yml header-patch-diagnostic.txt
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Center ribbon labels and use explicit two-line navigation'
          git push origin HEAD:fix/center-two-line-header
