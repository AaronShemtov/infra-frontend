name: one-time-aboutme-nav
on:
  push:
    branches: [nav-aboutme]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: nav-aboutme}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in [p for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts]:
              try: text=path.read_text()
              except UnicodeDecodeError: continue
              text=text.replace('cv.1ms.my','aboutme.1ms.my').replace('>cv</a>','>about me</a>').replace('— CV with downloadable PDF','— About Me with downloadable CV')
              path.write_text(text)
          PY
          rm .github/workflows/nav-aboutme.yml
          git config user.name 'GitHub Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A && git commit -m 'docs: rename CV navigation to About Me' && git push origin HEAD:nav-aboutme
